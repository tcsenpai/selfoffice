name: Sync upstream

# Twice a day: merge genspark-ai/genoffice main into a branch, re-apply the
# SelfOffice rebrand (tools/rebrand-upstream.mjs), open a PR and start CI on it.
# Never pushes to main: a human (or the cloud routine) reviews the PR. A merge
# conflict opens or refreshes one issue instead. One open sync PR at a time.

on:
  schedule:
    - cron: '0 7,19 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'tcsenpai/selfoffice'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # SYNC_TOKEN (PAT with repo + workflow scopes) is optional: without it the push is
          # refused when upstream changed a workflow file, and CI must be dispatched by hand
          token: ${{ secrets.SYNC_TOKEN || github.token }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Merge upstream and rebrand
        id: merge
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "selfoffice-sync[bot]"
          git config user.email "selfoffice-sync@users.noreply.github.com"
          # our workflows stay ours: upstream's CI edits never conflict or overwrite
          git config merge.ours.driver true
          printf '%s\n' '.github/workflows/** merge=ours' 'ee/** merge=ours' >> .git/info/attributes
          git remote add upstream https://github.com/genspark-ai/genoffice.git
          git fetch upstream main

          if [ -z "$(git log --oneline HEAD..upstream/main)" ]; then
            echo "state=uptodate" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$(gh pr list --label upstream-sync --state open --json number -q length)" != "0" ]; then
            echo "state=pending" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          BASE=$(git merge-base HEAD upstream/main)
          BRANCH="selfoffice/sync-upstream-$(date -u +%Y%m%d-%H%M)"
          git checkout -b "$BRANCH"

          if ! git merge --no-commit --no-ff upstream/main; then
            git diff --name-only --diff-filter=U > "$RUNNER_TEMP/conflicts.txt"
            git merge --abort
            echo "state=conflict" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # whatever upstream did to .github/workflows, the merge keeps ours; ee/ is under the
          # separate Enterprise License and must never be pulled in (the PR lists what was left out)
          git checkout HEAD -- .github/workflows ee
          git diff --cached --name-only --diff-filter=A -- .github/workflows ee | xargs -r git rm -qf
          git commit -m "build: merge upstream/main"

          node tools/rebrand-upstream.mjs "$BASE" upstream/main > "$RUNNER_TEMP/rebrand.json"
          git add -A
          git diff --cached --quiet || git commit -m "build: rebrand upstream changes"

          {
            echo "Merges \`genspark-ai/genoffice@main\` ($(git rev-list --count "$BASE"..upstream/main) commits)."
            echo
            echo "### Upstream commits"
            git log --oneline "$BASE"..upstream/main | head -40 | sed 's/^/- /'
            echo
            echo "### Needs a human look"
            echo "Lines added upstream that touch what this fork removed or replaced (Genspark, analytics, cloud, sign-in):"
            echo
            node tools/rebrand-upstream.mjs --report "$BASE" upstream/main
            echo
            echo "CI is started on this branch; merge only when it is green."
          } > "$RUNNER_TEMP/body.md"

          git push origin "$BRANCH"
          {
            echo "state=ready"
            echo "branch=$BRANCH"
            echo "count=$(git rev-list --count "$BASE"..upstream/main)"
          } >> "$GITHUB_OUTPUT"

      - name: Open the PR and start CI
        if: steps.merge.outputs.state == 'ready'
        env:
          GH_TOKEN: ${{ secrets.SYNC_TOKEN || github.token }}
          HAS_PAT: ${{ secrets.SYNC_TOKEN != '' }}
          BRANCH: ${{ steps.merge.outputs.branch }}
          COUNT: ${{ steps.merge.outputs.count }}
        run: |
          set -euo pipefail
          gh label create upstream-sync --color 5319e7 --description "Merge of genspark-ai/genoffice" 2>/dev/null || true
          gh pr create --base main --head "$BRANCH" \
            --title "build: sync upstream/main ($COUNT commits)" \
            --label upstream-sync \
            --body-file "$RUNNER_TEMP/body.md"
          # a PR opened with the workflow token does not start workflows by itself
          if [ "$HAS_PAT" != "true" ]; then gh workflow run ci.yml --ref "$BRANCH"; fi

      - name: Report a merge conflict
        if: steps.merge.outputs.state == 'conflict'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh label create upstream-sync --color 5319e7 --description "Merge of genspark-ai/genoffice" 2>/dev/null || true
          {
            echo "\`git merge upstream/main\` conflicts in:"
            echo
            sed 's/^/- /' "$RUNNER_TEMP/conflicts.txt"
            echo
            echo "Resolve locally with the \`sync-upstream\` skill (or the cloud routine), keeping our side for removed Genspark features and the \`@selfoffice/\` scope."
            echo
            echo "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          } > "$RUNNER_TEMP/issue.md"
          existing=$(gh issue list --label upstream-sync --state open --json number -q '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file "$RUNNER_TEMP/issue.md"
          else
            gh issue create --title "Upstream sync needs a manual merge" --label upstream-sync --body-file "$RUNNER_TEMP/issue.md"
          fi
